name: Auto Custom Panel Compiler

on:
  workflow_dispatch:
    inputs:
      project_type:
        description: "Project Template Type"
        required: true
        default: "external"
        type: string
      panel_name:
        description: "Custom Panel Name"
        required: true
        type: string
      dev_name:
        description: "Developer / Brand Name"
        required: true
        type: string
      keyauth_name:
        description: "KeyAuth App Name"
        required: false
        default: "EXTERNAL"
        type: string
      keyauth_ownerid:
        description: "KeyAuth Owner ID"
        required: false
        default: "6862743278"
        type: string
      keyauth_secret:
        description: "KeyAuth Secret"
        required: false
        default: "bda5ce36ddc610adc203a9f904103ae13eaf4b20f3aacff9b8cd505fe916d301"
        type: string
      keyauth_version:
        description: "KeyAuth Version"
        required: false
        default: "1.0"
        type: string
      keyauth_url:
        description: "KeyAuth API URL"
        required: false
        default: "https://keyauth.win/api/1.2/"
        type: string
      icon_url:
        description: "Direct URL to logo image (.png, .jpg, or .ico)"
        required: false
        default: ""
        type: string
      discord_user_id:
        description: "Discord Buyer User ID (for tagging)"
        required: false
        default: ""
        type: string
      discord_webhook_url:
        description: "Discord Webhook URL for build notifications"
        required: false
        default: ""
        type: string

jobs:
  build:
    name: Build Custom C/C++ Panel
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild Tools
        uses: microsoft/setup-msbuild@v2

      - name: Install Dependencies
        shell: cmd
        run: |
          pip install --no-cache-dir Pillow requests --quiet --no-warn-script-location

      - name: Fast Unpack Custom Projects Zip (7-Zip)
        shell: pwsh
        run: |
          $projType = "${{ inputs.project_type }}"
          if (-not $projType) { $projType = "external" }
          
          # Target project template zip
          $targetZip = "$projType.zip"
          $assetUrl = "https://github.com/${{ github.repository }}/releases/download/template-assets/$targetZip"
          Write-Host "Target Project Template: $projType ($targetZip)"

          $needDownload = $true
          if (Test-Path $targetZip) {
            $item = Get-Item $targetZip
            if ($item.Length -gt 1MB) {
              $needDownload = $false
              Write-Host "Local $targetZip verified ($([math]::Round($item.Length / 1MB, 2)) MB)"
            } else {
              Write-Host "Existing $targetZip is too small ($($item.Length) bytes), removing..."
              Remove-Item $targetZip -Force
            }
          }

          if ($needDownload) {
            Write-Host "Downloading $targetZip from $assetUrl..."
            try {
              Invoke-WebRequest -Uri $assetUrl -OutFile $targetZip
              $dlSize = (Get-Item $targetZip).Length
              Write-Host "Download complete: $([math]::Round($dlSize / 1MB, 2)) MB"
            } catch {
              Write-Host "Notice: $targetZip not found on release, trying projects.zip fallback..."
              $fallbackUrl = "https://github.com/${{ github.repository }}/releases/download/template-assets/projects.zip"
              Invoke-WebRequest -Uri $fallbackUrl -OutFile $targetZip
              $dlSize = (Get-Item $targetZip).Length
              Write-Host "Fallback download complete: $([math]::Round($dlSize / 1MB, 2)) MB"
            }
          }

          Write-Host "Unpacking $targetZip via high-speed 7-Zip..."
          if (Test-Path "project_template") {
            Remove-Item "project_template" -Recurse -Force
          }
          # Unpack using password '1' (or unencrypted)
          7z x $targetZip -o"project_template" -p1 -y -bso0 -bsp0
          $global:LASTEXITCODE = 0
          Write-Host "Extracted $projType project template successfully!"

          # Ensure ext/DirectX/Lib/x64 has all required DirectX libraries (d3dx11.lib, etc.)
          $targetDxDirs = @(
            "project_template/examples/example_win32_directx11/ext/DirectX/Lib/x64",
            "project_template/ext/DirectX/Lib/x64"
          )
          foreach ($td in $targetDxDirs) {
            if (-not (Test-Path $td)) {
              New-Item -ItemType Directory -Path $td -Force | Out-Null
            }
            if (Test-Path "deps/DirectX/Lib/x64") {
              Copy-Item -Path "deps/DirectX/Lib/x64/*" -Destination $td -Force
              Write-Host "Synced DirectX x64 libraries to: $td"
            }
          }

      - name: Restore NuGet Packages & Dependencies
        shell: pwsh
        run: |
          # Discover Panel solution or project
          $sln = Get-ChildItem -Path "project_template" -Recurse -Filter "*external*.sln" | Select-Object -First 1
          if (-not $sln) {
            $sln = Get-ChildItem -Path "project_template" -Recurse -Filter "*.sln" | Select-Object -First 1
          }
          if (-not $sln) {
            $sln = Get-ChildItem -Path "project_template" -Recurse -Filter "*.csproj" | Select-Object -First 1
          }
          if (-not $sln) {
            $sln = Get-ChildItem -Path "project_template" -Recurse -Filter "*.vcxproj" | Select-Object -First 1
          }

          if ($sln) {
            Write-Host "Restoring dependencies for: $($sln.FullName)"
            nuget restore $sln.FullName -Verbosity quiet -NonInteractive
          }

          # Ensure freetype / native packages are unpacked
          Get-ChildItem -Path "project_template" -Recurse -Filter "*.nupkg" | ForEach-Object {
            $targetDir = $_.DirectoryName
            Write-Host "Unpacking native package: $($_.Name) -> $targetDir"
            7z x $_.FullName -o"$targetDir" -y -bso0 -bsp0
            $global:LASTEXITCODE = 0
          }

      - name: Inject Custom Branding & KeyAuth
        shell: pwsh
        run: |
          python scripts/patch_and_build.py `
            --project-dir "project_template" `
            --panel-name "${{ inputs.panel_name }}" `
            --dev-name "${{ inputs.dev_name }}" `
            --keyauth-name "${{ inputs.keyauth_name }}" `
            --keyauth-ownerid "${{ inputs.keyauth_ownerid }}" `
            --keyauth-secret "${{ inputs.keyauth_secret }}" `
            --keyauth-version "${{ inputs.keyauth_version }}" `
            --keyauth-url "${{ inputs.keyauth_url }}" `
            --icon-url "${{ inputs.icon_url }}"

      - name: Multi-Project Compiler (C/C++ or C#)
        shell: pwsh
        run: |
          $projType = "${{ inputs.project_type }}"
          $isCSharp = ($projType -eq "csharp_loader") -or (Get-ChildItem -Path "project_template" -Recurse -Filter "*.csproj" | Select-Object -First 1)

          if ($isCSharp) {
            Write-Host "Detected C# Project / Loader!"
            $sln = Get-ChildItem -Path "project_template" -Recurse -Filter "*.sln" | Select-Object -First 1
            $csproj = Get-ChildItem -Path "project_template" -Recurse -Filter "*.csproj" | Select-Object -First 1
            $targetBuild = if ($sln) { $sln.FullName } else { $csproj.FullName }

            Write-Host "Restoring and Building C# Project: $targetBuild"
            nuget restore $targetBuild -Verbosity quiet -NonInteractive
            msbuild $targetBuild /p:Configuration=Release /v:minimal
          } else {
            # Target C/C++ solution or project
            $sln = Get-ChildItem -Path "project_template" -Recurse -Filter "*external*.sln" | Select-Object -First 1
            if (-not $sln) { $sln = Get-ChildItem -Path "project_template" -Recurse -Filter "*.sln" | Select-Object -First 1 }
            if (-not $sln) { $sln = Get-ChildItem -Path "project_template" -Recurse -Filter "*example_win32_directx11*.vcxproj" | Select-Object -First 1 }
            if (-not $sln) { $sln = Get-ChildItem -Path "project_template" -Recurse -Filter "*.vcxproj" | Select-Object -First 1 }

            if (-not $sln) {
              Write-Error "No Panel .sln or .vcxproj found in project_template!"
              exit 1
            }

            Write-Host "Building C/C++ Panel executable on 4 CPU cores: $($sln.FullName)"
            $dxLibPath = (Resolve-Path "deps/DirectX/Lib/x64" -ErrorAction SilentlyContinue)
            if ($dxLibPath) {
              $env:LIB = "$($dxLibPath.Path);$env:LIB"
              Write-Host "Injected DirectX Lib directory into LINK LIB: $($dxLibPath.Path)"
            }
            $atlLib = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio\*\*\VC\Tools\MSVC\*\atlmfc\lib\x64" -Directory -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($atlLib) {
              $env:LIB = "$($atlLib.FullName);$env:LIB"
              Write-Host "Injected ATL library directory into LIB: $($atlLib.FullName)"
            }

            msbuild $sln.FullName `
              /p:Configuration=Release `
              /p:Platform=x64 `
              /p:MultiProcessorCompilation=true `
              /p:CL_MPCount=4 `
              /p:PreferredToolArchitecture=x64 `
              /p:TrackFileAccess=false `
              /p:BuildInParallel=true `
              /m:4 `
              /t:Build `
              /v:minimal
          }

      - name: Build C# Loader Executable with Embedded Client.dll & cimgui.dll
        shell: pwsh
        run: |
          $projType = "${{ inputs.project_type }}"
          
          # Check if an .exe was already built or if we need to package Client.dll into C# Loader
          $builtExe = Get-ChildItem -Path "project_template" -Recurse -Filter "*.exe" | Where-Object {
            $_.FullName -notlike "*\.vs\*" -and $_.FullName -notlike "*\obj\*" -and $_.FullName -notlike "*\packages\*"
          } | Select-Object -First 1

          # Find compiled Client.dll
          $compiledClientDll = Get-ChildItem -Path "project_template" -Recurse -Filter "*.dll" | Where-Object {
            $_.Name -match "^client\.dll$" -and ($_.DirectoryName -match "bin" -or $_.DirectoryName -match "Release")
          } | Select-Object -First 1

          if ($compiledClientDll -or (-not $builtExe -and ($projType -eq "silent_aim" -or $projType -eq "csharp_loader"))) {
            Write-Host "Assembling C# Loader Executable (.exe) with compiled DLLs..."
            
            # Download and unpack csharp_loader.zip into loader_template
            $loaderZip = "csharp_loader.zip"
            if (-not (Test-Path $loaderZip)) {
              $assetUrl = "https://github.com/${{ github.repository }}/releases/download/template-assets/$loaderZip"
              Invoke-WebRequest -Uri $assetUrl -OutFile $loaderZip
            }
            if (Test-Path "loader_template") { Remove-Item "loader_template" -Recurse -Force }
            7z x $loaderZip -o"loader_template" -p1 -y -bso0 -bsp0
            $global:LASTEXITCODE = 0

            # Find LOADER project directory
            $loaderProj = Get-ChildItem -Path "loader_template" -Recurse -Filter "LOADER.csproj" | Select-Object -First 1
            if ($loaderProj) {
              $loaderDir = $loaderProj.DirectoryName
              
              # Copy compiled Client.dll into LOADER folder
              if ($compiledClientDll) {
                $destClient = "$loaderDir/Client.dll"
                if ((Resolve-Path $compiledClientDll.FullName).Path -ne (Resolve-Path $destClient -ErrorAction SilentlyContinue).Path) {
                  Copy-Item $compiledClientDll.FullName -Destination $destClient -Force
                  Write-Host "Injected compiled Client.dll into C# Loader: $destClient"
                }
              }

              # Check for cimgui.dll in project_template, deps, or loader_template
              $cimgui = Get-ChildItem -Path "project_template" -Recurse -Filter "cimgui.dll" | Select-Object -First 1
              if (-not $cimgui) {
                $cimgui = Get-ChildItem -Path "loader_template" -Recurse -Filter "cimgui.dll" | Select-Object -First 1
              }
              $destCimgui = "$loaderDir/cimgui.dll"
              if ($cimgui -and (Resolve-Path $cimgui.FullName).Path -ne (Resolve-Path $destCimgui -ErrorAction SilentlyContinue).Path) {
                Copy-Item $cimgui.FullName -Destination $destCimgui -Force
                Write-Host "Injected cimgui.dll into C# Loader: $destCimgui"
              } else {
                Write-Host "cimgui.dll verified in C# Loader: $destCimgui"
              }

              # Inject custom branding into C# Loader
              python scripts/patch_and_build.py `
                --project-dir "loader_template" `
                --panel-name "${{ inputs.panel_name }}" `
                --dev-name "${{ inputs.dev_name }}" `
                --keyauth-name "${{ inputs.keyauth_name }}" `
                --keyauth-ownerid "${{ inputs.keyauth_ownerid }}" `
                --keyauth-secret "${{ inputs.keyauth_secret }}" `
                --keyauth-version "${{ inputs.keyauth_version }}" `
                --keyauth-url "${{ inputs.keyauth_url }}" `
                --icon-url "${{ inputs.icon_url }}"

              # Restore and build the Loader solution
              $loaderSln = Get-ChildItem -Path "loader_template" -Recurse -Filter "*.sln" | Select-Object -First 1
              $targetBuild = if ($loaderSln) { $loaderSln.FullName } else { $loaderProj.FullName }
              
              Write-Host "Building C# Loader Standalone Executable: $targetBuild"
              nuget restore $targetBuild -Verbosity quiet -NonInteractive
              msbuild $targetBuild /p:Configuration=Release /v:minimal
            }
          }

      - name: Prepare Final Executable & Bundle Native Dependencies
        shell: pwsh
        run: |
          $safeName = "${{ inputs.panel_name }}" -replace '[\\/*?:"<>|]', '_'
          $searchDirs = @("loader_template", "project_template") | Where-Object { Test-Path $_ }
          
          # Find output .exe files created by build
          $builtExes = Get-ChildItem -Path $searchDirs -Recurse -Filter "*.exe" | Where-Object {
            $_.FullName -notlike "*\.vs\*" -and $_.FullName -notlike "*\obj\*" -and $_.FullName -notlike "*\packages\*"
          } | Sort-Object @{Expression={
            if ($_.DirectoryName -match "bin") { 0 }
            elseif ($_.DirectoryName -match "Release") { 1 }
            elseif ($_.DirectoryName -match "EXE") { 2 }
            else { 3 }
          }}, LastWriteTime -Descending

          $builtExe = $builtExes | Select-Object -First 1
          $isDllTarget = $false

          if (-not $builtExe) {
            $builtDlls = Get-ChildItem -Path $searchDirs -Recurse -Filter "*.dll" | Where-Object {
              $_.FullName -notlike "*\.vs\*" -and $_.FullName -notlike "*\obj\*" -and $_.FullName -notlike "*\packages\*" -and ($_.DirectoryName -match "bin" -or $_.DirectoryName -match "Release")
            } | Sort-Object LastWriteTime -Descending
            $builtExe = $builtDlls | Select-Object -First 1
            if ($builtExe) {
              $isDllTarget = $true
              Write-Host "Target output is a compiled DLL: $($builtExe.FullName)"
            }
          }

          if (-not $builtExe) {
            Write-Error "Build failed: No compiled .exe or .dll found!"
            exit 1
          }

          $ext = if ($isDllTarget) { "dll" } else { "exe" }
          $finalExe = "$safeName.$ext"
          Copy-Item $builtExe.FullName -Destination $finalExe -Force
          Write-Host "Created final output binary: $finalExe"

          # Create a complete standalone package
          $finalZip = "$safeName-Package.zip"
          $tempPkgDir = "dist_package"
          if (Test-Path $tempPkgDir) { Remove-Item $tempPkgDir -Recurse -Force }
          New-Item -ItemType Directory -Path $tempPkgDir -Force | Out-Null
          Copy-Item $finalExe -Destination "$tempPkgDir/$finalExe" -Force
          
          # Bundle client.dll & cimgui.dll if present anywhere in project (case-insensitive)
          Get-ChildItem -Path "project_template" -Recurse -Filter "*.dll" -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -match '^(client|cimgui)\.dll$'
          } | ForEach-Object {
            Copy-Item $_.FullName -Destination $tempPkgDir -Force
            Write-Host "Bundled native dependency into package: $($_.Name)"
          }

          # Bundle all output DLLs located in the same directory as the .exe
          Get-ChildItem -Path $builtExe.DirectoryName -Filter "*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName -Destination $tempPkgDir -Force
          }

          # Include DirectX runtimes if available
          if (Test-Path "deps/DirectX/Bin/x64") {
            Copy-Item -Path "deps/DirectX/Bin/x64/*" -Destination $tempPkgDir -Force
          }

          Compress-Archive -Path "$tempPkgDir/*" -DestinationPath $finalZip -Force
          Remove-Item $tempPkgDir -Recurse -Force
          Write-Host "Created standalone package: $finalZip"
          
          # Output environment variables
          echo "FINAL_EXE=$finalExe" >> $env:GITHUB_ENV
          echo "FINAL_ZIP=$finalZip" >> $env:GITHUB_ENV
          echo "SAFE_NAME=$safeName" >> $env:GITHUB_ENV

      - name: Upload GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE_NAME }}
          path: |
            ${{ env.FINAL_EXE }}
            ${{ env.FINAL_ZIP }}
          retention-days: 14

      - name: Create GitHub Release with Direct Download
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "Build: ${{ inputs.panel_name }} (${{ github.run_id }})"
          body: |
            ## Custom Panel Build Complete! 🚀
            - **Panel Name:** `${{ inputs.panel_name }}`
            - **Developer:** `${{ inputs.dev_name }}`
            - **KeyAuth App:** `${{ inputs.keyauth_name }}`
            - **Architecture:** x64 Standalone Executable (`/MT` Static Runtime)
            - **Build ID:** `${{ github.run_id }}`
          files: |
            ${{ env.FINAL_EXE }}
            ${{ env.FINAL_ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord Webhook
        if: always()
        shell: pwsh
        run: |
          $webhookUrl = "${{ inputs.discord_webhook_url }}"
          if (-not $webhookUrl) {
            $webhookUrl = "${{ secrets.DISCORD_WEBHOOK_URL }}"
          }

          if (-not $webhookUrl) {
            Write-Host "No Discord Webhook URL provided. Skipping notification."
            exit 0
          }

          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_id }}/${{ env.FINAL_EXE }}"
          $status = "${{ job.status }}"
          $color = 65280 # Green
          $title = "✅ Custom Panel Build Succeeded!"
          if ($status -ne "success") {
            $color = 16711680 # Red
            $title = "❌ Custom Panel Build Failed"
            $downloadUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }

          $pkgUrl = "https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_id }}/${{ env.FINAL_ZIP }}"
          $downloadText = "[Standalone .EXE]($downloadUrl) • [Full Package .ZIP (with DirectX DLLs)]($pkgUrl)"
          if ($status -ne "success") {
            $downloadText = "[View GitHub Build Logs]($downloadUrl)"
          }

          $payload = @{
            content = if ("${{ inputs.discord_user_id }}") { "<@${{ inputs.discord_user_id }}>" } else { $null }
            embeds = @(
              @{
                title = $title
                color = $color
                description = "Your custom panel executable has been generated!"
                fields = @(
                  @{ name = "📌 Panel Name"; value = "${{ inputs.panel_name }}"; inline = $true },
                  @{ name = "👑 Developer"; value = "${{ inputs.dev_name }}"; inline = $true },
                  @{ name = "🔐 KeyAuth App"; value = "${{ inputs.keyauth_name }}"; inline = $true },
                  @{ name = "⬇️ Direct Download"; value = $downloadText; inline = $false }
                )
                footer = @{ text = "Auto Custom Panel Maker • GitHub Actions Builder" }
                timestamp = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
              }
            )
          } | ConvertTo-Json -Depth 5

          try {
            Invoke-RestMethod -Uri $webhookUrl -Method Post -Body $payload -ContentType "application/json"
            Write-Host "Discord Webhook sent successfully!"
          } catch {
            Write-Host "Failed to send Discord webhook: $_"
          }
