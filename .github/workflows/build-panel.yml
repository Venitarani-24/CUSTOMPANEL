name: Auto Custom Panel Compiler

on:
  workflow_dispatch:
    inputs:
      panel_name:
        description: "Custom Panel Name"
        required: true
        type: string
      dev_name:
        description: "Developer / Brand Name"
        required: true
        type: string
      keyauth_name:
        description: "KeyAuth App Name"
        required: true
        type: string
      keyauth_ownerid:
        description: "KeyAuth Owner ID"
        required: true
        type: string
      keyauth_secret:
        description: "KeyAuth Secret"
        required: true
        type: string
      keyauth_version:
        description: "KeyAuth Version"
        required: false
        default: "1.0"
        type: string
      keyauth_url:
        description: "KeyAuth API URL"
        required: false
        default: "https://keyauth.win/api/1.2/"
        type: string
      icon_url:
        description: "Direct URL to logo image (.png, .jpg, or .ico)"
        required: false
        default: ""
        type: string
      discord_user_id:
        description: "Discord Buyer User ID (for tagging)"
        required: false
        default: ""
        type: string
      discord_webhook_url:
        description: "Discord Webhook URL for build notifications"
        required: false
        default: ""
        type: string

jobs:
  build:
    name: Build Custom C/C++ Panel
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild Tools
        uses: microsoft/setup-msbuild@v2

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Image Processing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow requests

      - name: Unpack Custom Projects Zip (if exists)
        shell: pwsh
        run: |
          if (Test-Path "projects.zip") {
            Write-Host "Found local projects.zip! Extracting over project_template..."
            Expand-Archive -Path "projects.zip" -DestinationPath "project_template" -Force
          } else {
            # Check if large template was uploaded to GitHub Releases 'template-assets'
            try {
              $assetUrl = "https://github.com/${{ github.repository }}/releases/download/template-assets/projects.zip"
              Write-Host "Checking for large template asset at $assetUrl..."
              Invoke-WebRequest -Uri $assetUrl -OutFile "projects.zip" -ErrorAction Stop
              Write-Host "Downloaded projects.zip from release assets! Extracting..."
              Expand-Archive -Path "projects.zip" -DestinationPath "project_template" -Force
            } catch {
              Write-Host "Using default C/C++ project template."
            }
          }

      - name: Inject Custom Branding & KeyAuth
        shell: pwsh
        run: |
          python scripts/patch_and_build.py `
            --project-dir "project_template" `
            --panel-name "${{ inputs.panel_name }}" `
            --dev-name "${{ inputs.dev_name }}" `
            --keyauth-name "${{ inputs.keyauth_name }}" `
            --keyauth-ownerid "${{ inputs.keyauth_ownerid }}" `
            --keyauth-secret "${{ inputs.keyauth_secret }}" `
            --keyauth-version "${{ inputs.keyauth_version }}" `
            --keyauth-url "${{ inputs.keyauth_url }}" `
            --icon-url "${{ inputs.icon_url }}"

      - name: Build C/C++ Solution (Release x64)
        shell: pwsh
        run: |
          # Auto-discover solution file (.sln) or project file (.vcxproj)
          $sln = Get-ChildItem -Path "project_template" -Recurse -Filter "*.sln" | Select-Object -First 1
          if (-not $sln) {
            $sln = Get-ChildItem -Path "project_template" -Recurse -Filter "*.vcxproj" | Select-Object -First 1
          }
          if (-not $sln) {
            Write-Error "No .sln or .vcxproj found in project_template!"
            exit 1
          }

          Write-Host "Found solution to build: $($sln.FullName)"
          
          # Run MSBuild Release x64
          msbuild $sln.FullName /p:Configuration=Release /p:Platform=x64 /t:Build /m /v:minimal

      - name: Prepare Final Executable
        shell: pwsh
        run: |
          $safeName = "${{ inputs.panel_name }}" -replace '[\\/*?:"<>|]', '_'
          
          # Find all output .exe files created by MSBuild
          $builtExes = Get-ChildItem -Path "project_template" -Recurse -Filter "*.exe" | Where-Object {
            $_.FullName -notlike "*\.vs\*" -and $_.FullName -notlike "*\obj\*" -and $_.FullName -notlike "*\packages\*"
          } | Sort-Object LastWriteTime -Descending

          $builtExe = $builtExes | Select-Object -First 1
          if (-not $builtExe) {
            Write-Error "Build failed: No compiled .exe found in project_template"
            exit 1
          }

          Write-Host "Found compiled executable: $($builtExe.FullName) ($([math]::Round($builtExe.Length/1MB, 2)) MB)"
          $finalExe = "$safeName.exe"
          Copy-Item $builtExe.FullName -Destination $finalExe -Force
          Write-Host "Created final executable: $finalExe"
          
          # Output environment variables
          echo "FINAL_EXE=$finalExe" >> $env:GITHUB_ENV
          echo "SAFE_NAME=$safeName" >> $env:GITHUB_ENV

      - name: Upload GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE_NAME }}
          path: ${{ env.FINAL_EXE }}
          retention-days: 14

      - name: Create GitHub Release with Direct Download
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "Build: ${{ inputs.panel_name }} (${{ github.run_id }})"
          body: |
            ## Custom Panel Build Complete! 🚀
            - **Panel Name:** `${{ inputs.panel_name }}`
            - **Developer:** `${{ inputs.dev_name }}`
            - **KeyAuth App:** `${{ inputs.keyauth_name }}`
            - **Architecture:** x64 Standalone Executable (`/MT` Static Runtime)
            - **Build ID:** `${{ github.run_id }}`
          files: ${{ env.FINAL_EXE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord Webhook
        if: always()
        shell: pwsh
        run: |
          $webhookUrl = "${{ inputs.discord_webhook_url }}"
          if (-not $webhookUrl) {
            $webhookUrl = "${{ secrets.DISCORD_WEBHOOK_URL }}"
          }

          if (-not $webhookUrl) {
            Write-Host "No Discord Webhook URL provided. Skipping notification."
            exit 0
          }

          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_id }}/${{ env.FINAL_EXE }}"
          $status = "${{ job.status }}"
          $color = 65280 # Green
          $title = "✅ Custom Panel Build Succeeded!"
          if ($status -ne "success") {
            $color = 16711680 # Red
            $title = "❌ Custom Panel Build Failed"
            $downloadUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }

          $payload = @{
            content = if ("${{ inputs.discord_user_id }}") { "<@${{ inputs.discord_user_id }}>" } else { $null }
            embeds = @(
              @{
                title = $title
                color = $color
                description = "Your custom panel executable has been generated!"
                fields = @(
                  @{ name = "📌 Panel Name"; value = "${{ inputs.panel_name }}"; inline = $true },
                  @{ name = "👑 Developer"; value = "${{ inputs.dev_name }}"; inline = $true },
                  @{ name = "🔐 KeyAuth App"; value = "${{ inputs.keyauth_name }}"; inline = $true },
                  @{ name = "⬇️ Direct Download"; value = "[Download Executable]($downloadUrl)"; inline = $false }
                )
                footer = @{ text = "Auto Custom Panel Maker • GitHub Actions Builder" }
                timestamp = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
              }
            )
          } | ConvertTo-Json -Depth 5

          try {
            Invoke-RestMethod -Uri $webhookUrl -Method Post -Body $payload -ContentType "application/json"
            Write-Host "Discord Webhook sent successfully!"
          } catch {
            Write-Host "Failed to send Discord webhook: $_"
          }
