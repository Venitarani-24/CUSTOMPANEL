name: Auto Custom Panel Compiler

on:
  workflow_dispatch:
    inputs:
      panel_name:
        description: "Custom Panel Name"
        required: true
        type: string
      dev_name:
        description: "Developer / Brand Name"
        required: true
        type: string
      keyauth_name:
        description: "KeyAuth App Name"
        required: true
        type: string
      keyauth_ownerid:
        description: "KeyAuth Owner ID"
        required: true
        type: string
      keyauth_secret:
        description: "KeyAuth Secret"
        required: true
        type: string
      keyauth_version:
        description: "KeyAuth Version"
        required: false
        default: "1.0"
        type: string
      keyauth_url:
        description: "KeyAuth API URL"
        required: false
        default: "https://keyauth.win/api/1.2/"
        type: string
      icon_url:
        description: "Direct URL to logo image (.png, .jpg, or .ico)"
        required: false
        default: ""
        type: string
      discord_user_id:
        description: "Discord Buyer User ID (for tagging)"
        required: false
        default: ""
        type: string
      discord_webhook_url:
        description: "Discord Webhook URL for build notifications"
        required: false
        default: ""
        type: string

jobs:
  build:
    name: Build Custom C/C++ Panel
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MSBuild Tools
        uses: microsoft/setup-msbuild@v2

      - name: Install Dependencies
        shell: cmd
        run: |
          pip install --no-cache-dir Pillow requests --quiet --no-warn-script-location

      - name: Fast Unpack Custom Projects Zip (7-Zip)
        shell: pwsh
        run: |
          $needDownload = $true
          if (Test-Path "projects.zip") {
            $item = Get-Item "projects.zip"
            if ($item.Length -gt 10MB) {
              $needDownload = $false
              Write-Host "Local projects.zip verified ($([math]::Round($item.Length / 1MB, 2)) MB)"
            } else {
              Write-Host "Existing projects.zip is only $($item.Length) bytes (dummy/old), removing..."
              Remove-Item "projects.zip" -Force
            }
          }

          if ($needDownload) {
            $assetUrl = "https://github.com/${{ github.repository }}/releases/download/template-assets/projects.zip"
            Write-Host "Downloading 58MB DirectX 11 Panel template from $assetUrl..."
            Invoke-WebRequest -Uri $assetUrl -OutFile "projects.zip"
            $dlSize = (Get-Item "projects.zip").Length
            Write-Host "Download complete: $([math]::Round($dlSize / 1MB, 2)) MB"
          }

          Write-Host "Unpacking projects.zip via high-speed 7-Zip..."
          if (Test-Path "project_template") {
            Remove-Item "project_template" -Recurse -Force
          }
          7z x "projects.zip" -o"project_template" -y | Out-Null
          Write-Host "Extracted DirectX 11 Panel project template successfully!"

      - name: Restore NuGet Packages & Dependencies
        shell: pwsh
        run: |
          # Discover Panel solution or project
          $sln = Get-ChildItem -Path "project_template" -Recurse -Filter "*external*.sln" | Select-Object -First 1
          if (-not $sln) {
            $sln = Get-ChildItem -Path "project_template" -Recurse -Filter "*.sln" | Select-Object -First 1
          }
          if (-not $sln) {
            $sln = Get-ChildItem -Path "project_template" -Recurse -Filter "*.vcxproj" | Select-Object -First 1
          }

          if ($sln) {
            Write-Host "Restoring NuGet packages for: $($sln.FullName)"
            nuget restore $sln.FullName -Verbosity quiet -NonInteractive
          }

          # Ensure freetype / native packages are unpacked
          Get-ChildItem -Path "project_template" -Recurse -Filter "*.nupkg" | ForEach-Object {
            $targetDir = $_.DirectoryName
            Write-Host "Unpacking native package: $($_.Name) -> $targetDir"
            7z x $_.FullName -o"$targetDir" -y | Out-Null
          }

      - name: Inject Custom Branding & KeyAuth
        shell: pwsh
        run: |
          python scripts/patch_and_build.py `
            --project-dir "project_template" `
            --panel-name "${{ inputs.panel_name }}" `
            --dev-name "${{ inputs.dev_name }}" `
            --keyauth-name "${{ inputs.keyauth_name }}" `
            --keyauth-ownerid "${{ inputs.keyauth_ownerid }}" `
            --keyauth-secret "${{ inputs.keyauth_secret }}" `
            --keyauth-version "${{ inputs.keyauth_version }}" `
            --keyauth-url "${{ inputs.keyauth_url }}" `
            --icon-url "${{ inputs.icon_url }}"

      - name: Turbo Multi-Core C/C++ Compilation (Release x64)
        shell: pwsh
        run: |
          # Target the DirectX 11 Panel GUI solution/project directly
          $sln = Get-ChildItem -Path "project_template" -Recurse -Filter "*external*.sln" | Select-Object -First 1
          if (-not $sln) {
            $sln = Get-ChildItem -Path "project_template" -Recurse -Filter "*.sln" | Select-Object -First 1
          }
          if (-not $sln) {
            $sln = Get-ChildItem -Path "project_template" -Recurse -Filter "*example_win32_directx11*.vcxproj" | Select-Object -First 1
          }
          if (-not $sln) {
            $sln = Get-ChildItem -Path "project_template" -Recurse -Filter "*.vcxproj" | Select-Object -First 1
          }
          if (-not $sln) {
            Write-Error "No Panel .sln or .vcxproj found in project_template!"
            exit 1
          }

          Write-Host "Building DirectX 11 Panel GUI executable on 4 CPU cores: $($sln.FullName)"
          
          # Maximize compilation speed using all 4 cores with 64-bit compiler binaries
          msbuild $sln.FullName `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:MultiProcessorCompilation=true `
            /p:CL_MPCount=4 `
            /p:PreferredToolArchitecture=x64 `
            /p:TrackFileAccess=false `
            /p:BuildInParallel=true `
            /m:4 `
            /t:Build `
            /v:minimal

      - name: Prepare Final Executable
        shell: pwsh
        run: |
          $safeName = "${{ inputs.panel_name }}" -replace '[\\/*?:"<>|]', '_'
          
          # Find all output .exe files created by MSBuild, prioritizing EXE folder and Release folder
          $builtExes = Get-ChildItem -Path "project_template" -Recurse -Filter "*.exe" | Where-Object {
            $_.FullName -notlike "*\.vs\*" -and $_.FullName -notlike "*\obj\*" -and $_.FullName -notlike "*\packages\*"
          } | Sort-Object @{Expression={
            if ($_.DirectoryName -match "EXE") { 0 }
            elseif ($_.DirectoryName -match "Release") { 1 }
            else { 2 }
          }}, LastWriteTime -Descending

          $builtExe = $builtExes | Select-Object -First 1
          if (-not $builtExe) {
            Write-Error "Build failed: No compiled .exe found in project_template"
            exit 1
          }

          Write-Host "Found compiled Panel GUI executable: $($builtExe.FullName) ($([math]::Round($builtExe.Length/1MB, 2)) MB)"
          $finalExe = "$safeName.exe"
          Copy-Item $builtExe.FullName -Destination $finalExe -Force
          Write-Host "Created final executable: $finalExe"
          
          # Output environment variables
          echo "FINAL_EXE=$finalExe" >> $env:GITHUB_ENV
          echo "SAFE_NAME=$safeName" >> $env:GITHUB_ENV

      - name: Upload GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SAFE_NAME }}
          path: ${{ env.FINAL_EXE }}
          retention-days: 14

      - name: Create GitHub Release with Direct Download
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: "Build: ${{ inputs.panel_name }} (${{ github.run_id }})"
          body: |
            ## Custom Panel Build Complete! 🚀
            - **Panel Name:** `${{ inputs.panel_name }}`
            - **Developer:** `${{ inputs.dev_name }}`
            - **KeyAuth App:** `${{ inputs.keyauth_name }}`
            - **Architecture:** x64 Standalone Executable (`/MT` Static Runtime)
            - **Build ID:** `${{ github.run_id }}`
          files: ${{ env.FINAL_EXE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Discord Webhook
        if: always()
        shell: pwsh
        run: |
          $webhookUrl = "${{ inputs.discord_webhook_url }}"
          if (-not $webhookUrl) {
            $webhookUrl = "${{ secrets.DISCORD_WEBHOOK_URL }}"
          }

          if (-not $webhookUrl) {
            Write-Host "No Discord Webhook URL provided. Skipping notification."
            exit 0
          }

          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/build-${{ github.run_id }}/${{ env.FINAL_EXE }}"
          $status = "${{ job.status }}"
          $color = 65280 # Green
          $title = "✅ Custom Panel Build Succeeded!"
          if ($status -ne "success") {
            $color = 16711680 # Red
            $title = "❌ Custom Panel Build Failed"
            $downloadUrl = "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }

          $payload = @{
            content = if ("${{ inputs.discord_user_id }}") { "<@${{ inputs.discord_user_id }}>" } else { $null }
            embeds = @(
              @{
                title = $title
                color = $color
                description = "Your custom panel executable has been generated!"
                fields = @(
                  @{ name = "📌 Panel Name"; value = "${{ inputs.panel_name }}"; inline = $true },
                  @{ name = "👑 Developer"; value = "${{ inputs.dev_name }}"; inline = $true },
                  @{ name = "🔐 KeyAuth App"; value = "${{ inputs.keyauth_name }}"; inline = $true },
                  @{ name = "⬇️ Direct Download"; value = "[Download Executable]($downloadUrl)"; inline = $false }
                )
                footer = @{ text = "Auto Custom Panel Maker • GitHub Actions Builder" }
                timestamp = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
              }
            )
          } | ConvertTo-Json -Depth 5

          try {
            Invoke-RestMethod -Uri $webhookUrl -Method Post -Body $payload -ContentType "application/json"
            Write-Host "Discord Webhook sent successfully!"
          } catch {
            Write-Host "Failed to send Discord webhook: $_"
          }
